<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Duelo migratorio | Maternity Global</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --green-1:#eef8f4;
      --green-2:#dff3ec;
      --green-3:#cfe9df;
      --green-4:#b7ddd0;
      --green-5:#2f9e8f;

      --blue-1:#0b6fb8;
      --blue-2:#0a82d1;
      --blue-3:#0f5f9c;
      --blue-4:#1b4d73;

      --white:#ffffff;
      --card:#fcfffd;
      --text:#163042;
      --muted:#607585;
      --line:rgba(11,111,184,.10);

      --shadow-lg:0 24px 60px rgba(15, 51, 62, .12);
      --shadow-md:0 14px 36px rgba(15, 51, 62, .10);
      --shadow-sm:0 10px 24px rgba(15, 51, 62, .08);

      --radius-xl:30px;
      --radius-lg:24px;
      --radius-md:18px;
      --max:1220px;
    }

    *{
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      font-family:"Nunito",system-ui,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top left, rgba(255,255,255,.80), transparent 20%),
        radial-gradient(circle at top right, rgba(255,255,255,.42), transparent 22%),
        linear-gradient(180deg, #f2fbf7 0%, var(--green-2) 34%, var(--green-3) 100%);
      min-height:100vh;
      overflow-x:hidden;
    }

    .bg-orb{
      position:fixed;
      z-index:0;
      pointer-events:none;
      border-radius:50%;
      filter:blur(10px);
      opacity:.45;
    }

    .bg-orb-1{
      width:340px;
      height:340px;
      left:-110px;
      top:160px;
      background:radial-gradient(circle, rgba(47,158,143,.22), rgba(47,158,143,0));
    }

    .bg-orb-2{
      width:420px;
      height:420px;
      right:-120px;
      top:260px;
      background:radial-gradient(circle, rgba(11,111,184,.12), rgba(11,111,184,0));
    }

    .container{
      position:relative;
      z-index:1;
      max-width:var(--max);
      margin:0 auto;
      padding:0 24px;
    }

    header{
      position:sticky;
      top:0;
      z-index:100;
      backdrop-filter:blur(14px);
      background:rgba(47, 158, 143, .88);
      border-bottom:1px solid rgba(255,255,255,.18);
    }

    .nav{
      min-height:76px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }

    .logo{
      text-decoration:none;
      color:#fff;
      font-weight:800;
      font-size:1.18rem;
      letter-spacing:.01em;
    }

    nav{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    nav a{
      text-decoration:none;
      color:#fff;
      font-weight:700;
      padding:10px 14px;
      border-radius:999px;
      transition:.22s ease;
    }

    nav a:hover{
      background:rgba(255,255,255,.14);
      transform:translateY(-1px);
    }

    main{
      padding:42px 0 90px;
    }

    .back-link{
      display:inline-flex;
      align-items:center;
      gap:8px;
      text-decoration:none;
      color:var(--blue-1);
      font-weight:800;
      margin-bottom:20px;
      padding:10px 14px;
      border-radius:999px;
      background:rgba(255,255,255,.52);
      border:1px solid rgba(255,255,255,.65);
      box-shadow:var(--shadow-sm);
    }

    .hero-shell{
      position:relative;
      overflow:hidden;
      background:
        linear-gradient(180deg, rgba(255,255,255,.84), rgba(255,255,255,.70)),
        linear-gradient(135deg, rgba(223,245,239,.45), rgba(255,255,255,.18));
      border:1px solid rgba(255,255,255,.75);
      border-radius:34px;
      box-shadow:var(--shadow-lg);
      padding:34px;
      margin-bottom:28px;
    }

    .hero-shell::before{
      content:"";
      position:absolute;
      inset:auto -80px -80px auto;
      width:260px;
      height:260px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(47,158,143,.12), rgba(47,158,143,0));
    }

    .hero{
      display:grid;
      grid-template-columns:1.18fr .72fr;
      gap:28px;
      align-items:start;
      position:relative;
      z-index:1;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      padding:8px 14px;
      border-radius:999px;
      background:rgba(11,111,184,.10);
      color:var(--blue-1);
      font-weight:800;
      font-size:.84rem;
      letter-spacing:.02em;
      margin-bottom:18px;
    }

    h1{
      margin:0 0 18px;
      font-size:clamp(2.2rem, 4.5vw, 4rem);
      line-height:1.04;
      letter-spacing:-.03em;
      color:var(--blue-4);
      max-width:900px;
      font-weight:800;
    }

    .gradient-word{
      background:linear-gradient(90deg, var(--green-5), #3aaf9f);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }

    .lead{
      margin:0;
      color:var(--text);
      font-size:1.12rem;
      line-height:1.9;
      max-width:820px;
    }

    .hero-card{
      background:linear-gradient(180deg, rgba(255,255,255,.84), rgba(248,255,252,.76));
      border:1px solid rgba(255,255,255,.85);
      border-radius:28px;
      padding:24px;
      box-shadow:var(--shadow-md);
    }
