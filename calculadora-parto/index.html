<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora FPP Profesional</title>
    <style>
        :root {
            --azul-regal: #0f1c3f;
            --dorado-premium: #c5a059;
            --dorado-luz: #f5d68a;
            --blanco: #ffffff;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calc-container {
            background: var(--azul-regal);
            color: var(--blanco);
            width: 90%;
            max-width: 420px;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border: 1px solid var(--dorado-premium);
            text-align: center;
        }

        h2 {
            color: var(--dorado-premium);
            font-weight: 300;
            letter-spacing: 1px;
            margin-top: 0;
        }

        .input-box {
            margin: 25px 0;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: var(--dorado-luz);
        }

        input[type="date"] {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--dorado-premium);
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
        }

        button {
            background: linear-gradient(135deg, var(--dorado-premium), #a68545);
            color: var(--azul-regal);
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            text-transform: uppercase;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(197, 160, 89, 0.4);
            filter: brightness(1.1);
        }

        .result-area {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.03);
            border-radius: 15px;
            display: none;
            border-left: 4px solid var(--dorado-premium);
        }

        .fpp-date {
            font-size: 1.6rem;
            color: var(--dorado-luz);
            margin: 10px 0;
            font-weight: bold;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: var(--dorado-premium);
            text-decoration: none;
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .back-link:hover { opacity: 1; text-decoration: underline; }
    </style>
</head>
<body>

<div class="calc-container">
    <h2>Calculadora de Parto</h2>
    <p style="font-size: 0.9rem; opacity: 0.8;">Ingresa la fecha de tu última menstruación para obtener tu fecha probable.</p>
    
    <div class="input-box">
        <label for="furDate">Fecha de última regla (FUR):</label>
        <input type="date" id="furDate">
    </div>

    <button onclick="calculateFPP()">Calcular Fecha Probable</button>

    <div id="result" class="result-area">
        <div style="font-size: 0.9rem; color: #ddd;">Tu fecha probable de parto es:</div>
        <div id="fppValue" class="fpp-date"></div>
        <div id="weeksInfo" style="font-size: 0.85rem; color: var(--dorado-luz);"></div>
    </div>

    <a href="../index.html" class="back-link">← Regresar al portal principal</a>
</div>

<script>
    function calculateFPP() {
        const input = document.getElementById('furDate').value;
        if (!input) return;

        const fur = new Date(input);
        
        // Regla de Naegele (Estándar médico)
        let fpp = new Date(fur);
        fpp.setDate(fpp.getDate() + 7);
        fpp.setMonth(fpp.getMonth() + 9);

        // Formatear fecha
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('fppValue').innerText = fpp.toLocaleDateString('es-ES', options);

        // Calcular semanas actuales
        const today = new Date();
        const diffInMs = today - fur;
        const weeks = Math.floor(diffInMs / (1000 * 60 * 60 * 24 * 7));

        if(weeks >= 0 && weeks <= 42) {
            document.getElementById('weeksInfo').innerText = `Te encuentras en la semana ${weeks} de gestación aproximadamente.`;
        }

        document.getElementById('result').style.display = 'block';
    }
</script>

</body>
</html>
