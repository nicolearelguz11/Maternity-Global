<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Parto | Profesional</title>
    <style>
        :root {
            --azul-marino: #0a192f;
            --dorado: #c5a059;
            --dorado-claro: #f5d68a;
            --blanco: #ffffff;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card-calculadora {
            background: var(--azul-marino);
            color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            border: 2px solid var(--dorado);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        h2 { color: var(--dorado); margin-bottom: 25px; font-weight: 300; }

        .input-group { text-align: left; margin-bottom: 20px; }

        label { display: block; color: var(--dorado-claro); margin-bottom: 8px; font-size: 0.9rem; }

        input[type="date"] {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--dorado);
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
        }

        button {
            background: var(--dorado);
            color: var(--azul-marino);
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            margin-top: 10px;
        }

        button:hover { background: var(--dorado-claro); transform: translateY(-2px); }

        #resultado {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            display: none;
            border: 1px dashed var(--dorado);
        }

        .fpp-resultado { color: var(--dorado-claro); font-size: 1.5rem; font-weight: bold; margin: 10px 0; }

        .btn-regresar {
            display: inline-block;
            margin-top: 25px;
            color: var(--dorado);
            text-decoration: none;
            font-size: 0.8rem;
            opacity: 0.7;
        }
        .btn-regresar:hover { opacity: 1; }
    </style>
</head>
<body>

<div class="card-calculadora">
    <h2>Calculadora FPP</h2>
    <div class="input-group">
        <label>Primer día de tu última regla:</label>
        <input type="date" id="fur">
    </div>
    <button onclick="calcular()">Calcular Fecha</button>

    <div id="resultado">
        <p style="margin:0; font-size: 0.9rem;">Fecha probable de parto:</p>
        <div id="fpp-texto" class="fpp-resultado"></div>
        <p id="semanas-info" style="font-size: 0.85rem; margin-top: 10px; color: #ccc;"></p>
    </div>

    <a href="../index.html" class="btn-regresar">← Volver al portal principal</a>
</div>

<script>
    function calcular() {
        const furInput = document.getElementById('fur').value;
        if(!furInput) return alert("Por favor selecciona una fecha");

        let fur = new Date(furInput);
        let fpp = new Date(fur);
        // Regla de Naegele
        fpp.setDate(fpp.getDate() + 7);
        fpp.setMonth(fpp.getMonth() + 9);

        const opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('fpp-texto').innerText = fpp.toLocaleDateString('es-ES', opciones);
        
        // Semanas actuales
        let hoy = new Date();
        let diff = hoy - fur;
        let semanas = Math.floor(diff / (1000 * 60 * 60 * 24 * 7));
        
        if(semanas >= 0 && semanas <= 42) {
            document.getElementById('semanas-info').innerText = "Tienes aproximadamente " + semanas + " semanas de gestación.";
        }

        document.getElementById('resultado').style.display = 'block';
    }
</script>

</body>
</html>
